<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · RAÍZ</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="bg-fondo text-texto min-h-screen flex flex-col justify-between">
    <!-- ✍️ B3 · Esta página va SOLO con Tailwind (src/tailwind.css), sin SASS. Ponle las clases de utilidad:
         los colores de RAÍZ (del @theme), dos columnas desde md y un botón con hover: y focus-visible:.
         Nada de valores sueltos entre corchetes ni style="". -->
    <header class="bg-marca text-white p-4 flex justify-between items-center shadow-md">
      <a href="/" class="font-bold text-xl">RAÍZ</a>
      <nav aria-label="Principal" class="flex gap-4">
        <a href="/" class="hover:underline">Inicio</a>
        <a href="/producto.html" class="hover:underline">Monstera</a>
        <a href="/contacto.html" aria-current="page" class="underline font-semibold">Contacto</a>
      </nav>
    </header>

    <main class="max-w-4xl mx-auto p-6 my-8 flex-grow">
      <h1 class="text-3xl font-bold text-marca-oscuro mb-6">Contacto</h1>

      <div class="grid md:grid-cols-2 gap-8 items-start">
        <section aria-label="Dónde estamos" class="bg-white p-6 rounded-lg shadow-sm border border-tierra/20">
          <h2 class="text-xl font-semibold text-marca-oscuro mb-3">El vivero</h2>
          <p class="mb-2">Abrimos de lunes a sábado, de 9:00 a 14:00. Si vienes en persona, te ayudamos a elegir.</p>
          <p class="font-medium text-tierra">Envíos gratis desde 40 €</p>
        </section>

        <form action="#" class="bg-white p-6 rounded-lg shadow-sm border border-tierra/20 flex flex-col gap-4">
          <label for="nombre" class="flex flex-col gap-1 font-medium">
            Nombre
            <input
              id="nombre"
              name="nombre"
              autocomplete="name"
              required
              class="border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-marca"
            />
          </label>
          <label for="correo" class="flex flex-col gap-1 font-medium">
            Correo
            <input
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              required
              class="border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-marca"
            />
          </label>
          <label for="mensaje" class="flex flex-col gap-1 font-medium">
            ¿En qué te ayudamos?
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              required
              class="border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-marca"
            ></textarea>
          </label>
          <button
            type="submit"
            class="bg-marca text-white font-semibold py-2 px-4 rounded transition-colors hover:bg-marca-oscuro focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-marca"
          >
            Enviar
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-marca-oscuro text-white text-center p-4">RAÍZ, vivero online · Cádiz</footer>
  </body>
</html>
